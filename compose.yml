# Maze Runner FPS: Docker Compose
#
# Runs the headless game server. Exposes UDP port 34254 by default.
#
# To choose a level (1, 2, or 3) or a different port, override the
# command directly, and include --service-ports so the port mapping
# below still applies:
#
#   docker compose run --rm --service-ports server --level 2
#
services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "34254:34254/udp"
    stdin_open: true
    tty: true