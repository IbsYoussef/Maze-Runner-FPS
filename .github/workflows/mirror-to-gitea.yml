name: Mirror to Gitea

on:
  push:
    branches:
      - '**'
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git remote add gitea https://iyoussef:${GITEA_TOKEN}@learn.01founders.co/git/iyoussef/Multiplayer-FPS.git
          git fetch --prune origin
          git push gitea HEAD:${GITHUB_REF#refs/heads/} --force
          git push gitea --prune
